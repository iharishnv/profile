name: Nokia sell tracker

on:
  schedule:
    # Weekdays, mid-session and just before the Helsinki close (16:30 UTC in winter).
    - cron: "15 10,16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  SYMBOL: NOKIA.HE
  SHARES: "900"
  TRANCHES: "3"
  START_DATE: "2026-10-21"
  END_DATE: "2026-11-20"
  TARGET_PRICE: ""
  TRAIL_PCT: "6"
  ISSUE_TITLE: "Nokia sell tracker"

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: t
        run: python3 tracker/nokia_sell_tracker.py

      - name: Update tracker issue and alert on sell signals
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ steps.t.outputs.action }}
          KEY: ${{ steps.t.outputs.signal_key }}
          REPORT: ${{ steps.t.outputs.report }}
          OWNER: ${{ github.repository_owner }}
        run: |
          num=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number -q '.[0].number')
          if [ -z "$num" ]; then
            num=$(gh issue create --title "$ISSUE_TITLE" --body "$REPORT" | grep -o '[0-9]*$')
          else
            gh issue edit "$num" --body "$REPORT"
          fi
          # Comment (which emails the owner) only on actionable signals, once per day per signal.
          case "$ACTION" in
            "SELL TRANCHE"|"SELL ALL"|"WATCH")
              if ! gh issue view "$num" --comments --json comments -q '.comments[].body' | grep -qF "<!-- $KEY -->"; then
                gh issue comment "$num" --body "@$OWNER **$ACTION** — Nokia at ${{ steps.t.outputs.price }}
          $REPORT
          <!-- $KEY -->"
              fi ;;
            "EXPIRED")
              gh issue close "$num" --comment "30-day window ended. Disable this workflow." ;;
          esac
